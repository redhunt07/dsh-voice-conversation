name: Plugin tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npm test
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: '*.tgz'
