name: Publish GitHub Package
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - package.json
      - 'dist/**'
      - scripts/prepare-github-package.mjs
      - .github/workflows/publish-github-package.yml
permissions:
  contents: read
  packages: write
concurrency:
  group: github-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'redhunt07/dsh-voice-conversation'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@redhunt07'
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit
      - run: npm run build
      - run: npm test
      - run: python3 tests/speech_text.py
      - name: Prepare the scoped GitHub distribution
        run: node scripts/prepare-github-package.mjs
      - name: Publish and verify the repository package
        working-directory: github-package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          package_name=$(node -p 'require("./package.json").name')
          package_version=$(node -p 'require("./package.json").version')
          if npm view "$package_name@$package_version" version --registry=https://npm.pkg.github.com > /dev/null 2>&1; then
            echo "This package version is already published."
          else
            npm publish --ignore-scripts --access public --registry=https://npm.pkg.github.com
          fi
          npm view "$package_name@$package_version" name version --registry=https://npm.pkg.github.com
          echo "Published repository package: $package_name@$package_version" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify package repository and visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const owner = process.env.GITHUB_REPOSITORY_OWNER;
          const response = await fetch(`https://api.github.com/users/${owner}/packages/npm/dsh-voice-conversation`, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
          });
          if (!response.ok) throw new Error(`Package metadata verification failed: ${response.status}`);
          const pkg = await response.json();
          if (pkg.repository?.full_name !== process.env.GITHUB_REPOSITORY) throw new Error('Package is not linked to this repository');
          const status = { name: pkg.name, visibility: pkg.visibility, url: pkg.html_url, repository: pkg.repository.full_name };
          console.log('PACKAGE_STATUS=' + JSON.stringify(status));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\nPackage visibility: **${pkg.visibility}**\n\n[Open the repository package](${pkg.html_url})\n`);
          NODE
